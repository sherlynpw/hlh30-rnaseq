# hlh30-all - consolidated samplesheet: WT vs hlh-30(tm1978) across L1/L4/Day3/Day6
#
# Two sequencing runs:
#   VZRJXQ (28 samples) - L4, Day3, Day6 at RT/20C   [previously samples/VZRJXQ_samplesheet.yaml]
#   HNPZCJ (6 samples)  - L1, WT + mutant, 3 reps each  [new, 2026-07]
#
# NAMING: the `genotype` values are the filename/factor-level-safe tokens
#   WT      -> displayed as "WT"              (was N2)
#   tm1978  -> displayed as "hlh-30(tm1978)"  (was hlh-30)
# Parentheses would end up in DESeq2 factor levels, result filenames and Make
# targets, so the label mapping lives in the plotting scripts instead.
#
# `run` is carried so the VZRJXQ/HNPZCJ batch split is visible on PCA. Note it
# is perfectly confounded with stage==L1 - do not put it in a DESeq2 design.
#
# Upload the new BAMs first:
#   unzip ~/downloads/HNPZCJ_bam.zip -d data/
#   aws s3 sync data/HNPZCJ_bam/ s3://celegans-pipeline-rayandrew/data/HNPZCJ_bam/ \
#       --exclude '*unmapped-reads.bam'

samples:
  # ============================================================
  # HNPZCJ - L1 (new)
  # ============================================================

  # --- WT L1 ---
  - sample_id: WT_L1_1
    bam: s3://celegans-pipeline-rayandrew/data/HNPZCJ_bam/HNPZCJ_1_WT_L1_rep_1_dedup-mapped-reads.bam
    input_type: plasmidsaurus_bam
    strandedness: forward
    genotype: WT
    stage: L1
    temperature: L1
    source: plasmidsaurus
    run: HNPZCJ
    replicate: 1

